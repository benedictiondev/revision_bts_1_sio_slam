<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diviseurs</title>
</head>
<body>
    <center>
        <h1>Exerccice Diviseurs</h1>
   
   <script type="text/javascript">
    let nb = parseInt(prompt("Donner un nombre entier :"));
  for (let div=1; div<=nb; div++){
            if (nb % div ==0){
                alert(div + " est un diviseur.");
            }
        }
    
   </script>
  
    
</body>
</html>
